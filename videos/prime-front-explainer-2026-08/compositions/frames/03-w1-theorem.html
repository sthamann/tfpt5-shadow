  <script>
    (() => {
      const DUR = 15.288;
      const ACCENT = "#38bdf8";
      const ACCENT_BRIGHT = "#bae6fd";

      /* ── build heatmap cells (deterministic pattern) ── */
      const N = 10;
      const heat = document.getElementById("f03-heatmap");
      const cells = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const el = document.createElement("div");
          el.className = "f03-cell";
          const v = 0.1 + 0.75 * Math.abs(Math.sin(r * 1.7 + c * 2.3 + r * c * 0.35));
          el.dataset.op = v.toFixed(3);
          heat.appendChild(el);
          cells.push({ el, r, c, op: v });
        }
      }
      const pairCells = [cells[3 * N + 6].el, cells[5 * N + 3].el, cells[7 * N + 7].el];

      /* ── build kernel curve: Ricker wavelet (g″ of a Gaussian) ── */
      const curve = document.getElementById("f03-curve");
      const pts = [];
      const px = (t) => 20 + ((t + 4) / 8) * 524;
      const py = (t) => 148 - (1 - t * t) * Math.exp((-t * t) / 2) * 100;
      for (let t = -4; t <= 4.001; t += 0.08) pts.push(px(t).toFixed(1) + " " + py(t).toFixed(1));
      curve.setAttribute("d", "M" + pts.join(" L"));
      const L = curve.getTotalLength();
      curve.setAttribute("stroke-dasharray", L);

      const dotTs = [-1.7, 0, 1.7];
      const dots = dotTs.map((t, i) => {
        const d = document.getElementById("f03-dot-" + i);
        d.setAttribute("cx", px(t).toFixed(1));
        d.setAttribute("cy", py(t).toFixed(1));
        return d;
      });

      /* ── timeline ── */
      const tl = gsap.timeline({ paused: true });

      /* macro camera drift under the whole shot */
      tl.fromTo("#f03-camera", { scale: 1 }, { scale: 1.035, duration: DUR, ease: "none", transformOrigin: "50% 45%" }, 0);

      /* opening chrome — something lands well before 0.5s */
      tl.fromTo("#f03-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.12);
      tl.fromTo("#f03-framenum", { opacity: 0 }, { opacity: 0.85, duration: 0.45, ease: "power2.out" }, 0.3);
      tl.fromTo("#f03-hairline", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power2.out", transformOrigin: "top center" }, 0.25);

      /* ── Scene 1 (0.0–3.8s): LEFT panel books open on "Fenstermatrix" (1.9s) ── */
      tl.fromTo(
        "#f03-card-left",
        { x: -320, rotationY: 22, opacity: 0 },
        { x: 0, rotationY: 14, opacity: 1, duration: 0.9, ease: "power3.out" },
        1.9,
      );
      tl.fromTo(
        ["#f03-title-left", "#f03-tag-left"],
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", stagger: 0.12 },
        2.15,
      );
      /* heatmap cells light row by row */
      cells.forEach(({ el, r, c, op }) => {
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.4 },
          { opacity: op, scale: 1, duration: 0.35, ease: "power2.out" },
          2.45 + r * 0.09 + c * 0.012,
        );
      });

      /* ── Scene 2 (3.8–9.0s): RIGHT panel mirrors in on "etwas Klassisches" (5.1s) ── */
      tl.fromTo(
        "#f03-card-right",
        { x: 320, rotationY: -22, opacity: 0 },
        { x: 0, rotationY: -14, opacity: 1, duration: 0.9, ease: "power3.out" },
        5.1,
      );
      tl.fromTo(
        ["#f03-title-right", "#f03-tag-right"],
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", stagger: 0.12 },
        5.35,
      );
      /* kernel curve self-draw */
      tl.fromTo(curve, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.95, ease: "power2.inOut" }, 5.45);
      tl.fromTo("#f03-kernel-label", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.05);
      dots.forEach((d, i) => {
        tl.fromTo(d, { attr: { r: 0 } }, { attr: { r: 6 }, duration: 0.3, ease: "power3.out" }, 6.1 + i * 0.1);
      });

      /* "Wort für Wort" (6.2s) — cell↔curve-point pairs blink in sync */
      const glowTimes = [6.35, 7.05, 7.75];
      glowTimes.forEach((T, i) => {
        const cell = pairCells[i];
        const dot = dots[i];
        tl.to(cell, { backgroundColor: ACCENT_BRIGHT, scale: 1.45, opacity: 1, duration: 0.16, ease: "power2.out" }, T);
        tl.to(cell, { backgroundColor: ACCENT, scale: 1, opacity: cell.dataset.op, duration: 0.36, ease: "power2.inOut" }, T + 0.18);
        tl.to(dot, { attr: { r: 10 }, fill: ACCENT_BRIGHT, duration: 0.16, ease: "power2.out" }, T);
        tl.to(dot, { attr: { r: 6 }, fill: ACCENT, duration: 0.36, ease: "power2.inOut" }, T + 0.18);
      });

      /* counter-phase idle bob (chained legs — no yoyo/repeat) */
      for (let i = 0; i < 8; i++) {
        const t = 6.6 + i * 0.7;
        const upLeg = i % 2 === 0;
        tl.to("#f03-card-left", { y: upLeg ? -5 : 0, duration: 0.7, ease: "sine.inOut" }, t);
        tl.to("#f03-card-right", { y: upLeg ? 5 : 0, duration: 0.7, ease: "sine.inOut" }, t);
      }

      /* ── Scene 3 (9.0–12.2s): "=" badge spring-pops on "W-eins-Theorem" (9.8s) ── */
      tl.fromTo("#f03-badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 9.8);
      /* stamp — hard-cut reveal */
      tl.fromTo("#f03-stamp", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 10.15);
      tl.fromTo("#f03-stamp", { scale: 1.12 }, { scale: 1, duration: 0.18, ease: "power3.out" }, 10.15);
      /* keyword glow on "maschinell verifiziert" (10.7s) */
      tl.to("#f03-stamp", { color: ACCENT_BRIGHT, borderColor: ACCENT_BRIGHT, duration: 0.18, ease: "power2.out" }, 10.7);
      tl.to("#f03-stamp", { color: ACCENT, borderColor: ACCENT, duration: 0.42, ease: "power2.inOut" }, 10.92);

      /* ── Scene 4 (12.2–15.3s): erratum chip, discrete text sequence (13.8s) ── */
      tl.fromTo("#f03-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 13.62);

      const FULL = "Erratum: self-found, corrected the same day — documented";
      const SEQ = [
        { t: 0, text: "" },
        { t: 13.82, text: "Err" },
        { t: 13.94, text: "Erratum:" },
        { t: 14.08, text: "Erratum: self-found," },
        { t: 14.26, text: "Erratum: self-found, corrected" },
        { t: 14.4, text: "Erratum: self-found, corrected the same" },
        { t: 14.58, text: "Erratum: self-found, corrected the same day" },
        { t: 14.82, text: FULL },
      ];
      const textAt = (time) => {
        for (let i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].text;
        return "";
      };
      const chipText = document.getElementById("f03-chip-text");
      const chipCursor = document.getElementById("f03-chip-cursor");
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: () => {
            chipText.textContent = textAt(driver.t);
            /* deterministic block-cursor blink, sin square wave, ~0.6s cycle */
            chipCursor.style.opacity = Math.sin(driver.t * ((Math.PI * 2) / 0.6)) > 0 ? "1" : "0";
          },
        },
        0,
      );
      /* nothing moves after ~15.0 — held read into the outgoing transition */

      window.__timelines = window.__timelines || {};
      window.__timelines["03-w1-theorem"] = tl;
    })();
  </script>
