      var rr = document.getElementById("ihara06-slot").getBoundingClientRect();
      if (sr.width > 0 && rr.width > 0) {
        var k = sr.width / 1920;
        offX = (rr.left + rr.width / 2 - (sr.left + sr.width / 2)) / k;
        offY = (rr.top + rr.height / 2 - (sr.top + sr.height / 2)) / k;

    /* scale + counter-translate share position, duration, ease */
    tl.to("#ihara06-zoom-outer", { scale: 2.4, duration: 1.5, ease: "power3.inOut" }, 13.2);
    tl.to("#ihara06-zoom-inner", { x: -offX, y: -offY, duration: 1.5, ease: "power3.inOut" }, 13.2);

    /* ambient-glow-bloom, pulse-on-arrival: one breath, then hold */
    tl.fromTo("#ihara06-glow", { opacity: 0, scale: 0.82 }, { opacity: 0.34, scale: 1, duration: 0.75, ease: "power2.out" }, 14.3);
    tl.to("#ihara06-glow", { opacity: 0.2, scale: 0.97, duration: 0.9, ease: "power2.inOut" }, 15.1);

    /* "Hilbert–Pólya" — per-word reveal */
    gsap.utils.toArray(".ihara06-w").forEach(function (el, i) {

    });

    window.__timelines[ID] = tl;
  })();
