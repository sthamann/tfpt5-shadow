<script>
  (function () {
    var DURATION = 13.848;
    var NS = "http://www.w3.org/2000/svg";

    /* ---- build the E8 rosette (240-root projection: 8 rings x 30 points) ---- */
    var rosette = document.getElementById("gz02-rosette");
    var CX = 310, CY = 310;
    var RING_COUNT = 8, PER_RING = 30;
    var R_INNER = 82, R_STEP = 30; // outermost ring at r = 292

    var spokesGroup = document.createElementNS(NS, "g");
    var ringsGroup = document.createElementNS(NS, "g");
    var dotsGroup = document.createElementNS(NS, "g");
    rosette.appendChild(ringsGroup);
    rosette.appendChild(spokesGroup);
    rosette.appendChild(dotsGroup);

    var R_OUTER = R_INNER + (RING_COUNT - 1) * R_STEP;
    for (var s = 0; s < PER_RING; s++) {
      var a = (s * 360 / PER_RING) * Math.PI / 180;
      var ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", (CX + R_INNER * Math.cos(a)).toFixed(2));
      ln.setAttribute("y1", (CY + R_INNER * Math.sin(a)).toFixed(2));
      ln.setAttribute("x2", (CX + R_OUTER * Math.cos(a)).toFixed(2));
      ln.setAttribute("y2", (CY + R_OUTER * Math.sin(a)).toFixed(2));
      ln.setAttribute("class", "gz02-spoke");
      spokesGroup.appendChild(ln);
    }
    [R_INNER + 3 * R_STEP + 15, R_OUTER].forEach(function (rr, i) {
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", CX);
      c.setAttribute("cy", CY);
      c.setAttribute("r", rr);
      c.setAttribute("class", "gz02-ringline");
      c.setAttribute("id", "gz02-ring-" + i);
      ringsGroup.appendChild(c);
    });
    for (var ri = 0; ri < RING_COUNT; ri++) {
      var rad = R_INNER + ri * R_STEP;
      var offset = (ri % 2) * (180 / PER_RING); // alternate rings interleave -> rosette read
      for (var di = 0; di < PER_RING; di++) {
        var ang = ((di * 360 / PER_RING) + offset) * Math.PI / 180;
        var dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", (CX + rad * Math.cos(ang)).toFixed(2));
        dot.setAttribute("cy", (CY + rad * Math.sin(ang)).toFixed(2));
        dot.setAttribute("r", "0");
        dot.setAttribute("fill-opacity", (0.95 - ri * 0.08).toFixed(2));
        dot.setAttribute("class", "gz02-dot");
        dotsGroup.appendChild(dot);
      }
    }

    /* ---- svg-path-draw setup: measured lengths, dash fully offset ---- */
    var drawables = [];
    ["gz02-seg1", "gz02-seg2", "gz02-seg3", "gz02-ring-0", "gz02-ring-1"].forEach(function (id) {
      drawables.push(document.getElementById(id));
    });
    spokesGroup.querySelectorAll("line").forEach(function (p) { drawables.push(p); });
    drawables.forEach(function (p) {
      var len = p.getTotalLength();
      p.style.strokeDasharray = String(len);
      p.style.strokeDashoffset = String(len);
    });

    /* ---- virtual camera (viewport-change, single wrapper: translate(x,y) scale(S)) ---- */
    var world = document.getElementById("gz02-world");
    var cam = { scale: 1, x: 0, y: 0 };
    function applyCamera() {
      world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
    }
    applyCamera(); // seed frame 0

    // station centers in world space: 960 / 2360 / 3760 / 5160; T = -offset x S (S = 1)
    var PAN_2 = -1400, PAN_3 = -2800, PAN_4 = -4200;

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* ===== Scene 1 (0.0-2.4s) — station 1: the two axiom chips ===== */
    tl.fromTo("#gz02-kicker", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.15);
    tl.fromTo("#gz02-tag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.25);
    tl.fromTo("#gz02-st1-head", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);
    tl.fromTo("#gz02-st1-title", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.12);
    // spring-pop-entrance: smooth power3 settle, no overshoot; chips pop one after the other
    tl.fromTo("#gz02-chip-a", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.28);
    tl.fromTo("#gz02-chip-b", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.35);
    // connector hairline draws to the right (svg-path-draw)
    tl.to("#gz02-seg1", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.9);

    /* ===== Scene 2 (2.4-4.4s) — pan on "E-acht-Gitter", rosette draws itself ===== */
    tl.fromTo(cam, { x: 0 }, { x: PAN_2, duration: 0.9, ease: "power3.inOut", onUpdate: applyCamera }, 2.5);
    tl.fromTo("#gz02-st2-head", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.9);
    tl.fromTo("#gz02-st2-title", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.95);
    tl.to("#gz02-rosette .gz02-spoke", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.018 }, 3.0);
    tl.to("#gz02-ring-0", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.15);
    tl.to("#gz02-ring-1", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 3.3);
    // 240 roots cascade in (staggered)
    tl.fromTo("#gz02-rosette .gz02-dot", { attr: { r: 0 }, opacity: 0 }, { attr: { r: 3.2 }, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.0035 }, 3.2);
    tl.fromTo("#gz02-rosette-label", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.0);
    tl.to("#gz02-seg2", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 4.2);

    /* ===== Scene 3 (4.4-9.6s) — pan on "Zaehlfunktion", theta card + Hecke pills ===== */
    tl.fromTo(cam, { x: PAN_2 }, { x: PAN_3, duration: 0.95, ease: "power3.inOut", onUpdate: applyCamera, immediateRender: false }, 4.55);
    tl.fromTo("#gz02-st3-head", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 5.0);
    tl.fromTo("#gz02-st3-title", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 5.05);
    tl.fromTo("#gz02-card", { scale: 0.92, opacity: 0, y: 18 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.1);
    tl.fromTo("#gz02-shell", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 5.75);
    // dynamic-content-sequencing: per-pill start times computed from content length,
    // paced onto the VO beat "Jede wirkt als eigener Pruefkanal" (6.9-8.3s)
    var PILL_BASE = 0.18, PILL_SEC_PER_CHAR = 0.035;
    var pillCursor = 6.9;
    gsap.utils.toArray("#gz02-pills .gz02-pill").forEach(function (el) {
      tl.fromTo(el, { scale: 0, opacity: 0, y: 14 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, pillCursor);
      pillCursor += PILL_BASE + el.textContent.trim().length * PILL_SEC_PER_CHAR;
    });
    tl.to("#gz02-seg3", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 8.9);

    /* ===== Scene 4 (9.6-13.848s) — last pan on "Zetafunktion"; camera lands and holds ===== */
    tl.fromTo(cam, { x: PAN_3 }, { x: PAN_4, duration: 1.05, ease: "power3.inOut", onUpdate: applyCamera, immediateRender: false }, 9.85);
    tl.fromTo("#gz02-st4-head", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 10.35);
    tl.fromTo("#gz02-zeta-wrap", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 10.35);
    // on "Schatten dieser Geometrie" (11.7s) the payoff mono line reveals; then stillness
    tl.fromTo("#gz02-payoff", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 11.7);

    // full-span anchor so the timeline covers the frame duration
    tl.to({}, { duration: DURATION }, 0);

    window.__timelines["02-geometrie-zuerst"] = tl;
  })();
</script>
