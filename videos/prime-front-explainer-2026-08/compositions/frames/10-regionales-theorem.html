<script>
  (function () {
    var ID = "10-regionales-theorem";
    var ACCENT = "#38bdf8";
    function $(s) { return document.getElementById("rt10-" + s); }

    /* — build the certified-cell grid (deterministic, no randomness) — */
    var cellsG = $("cells");
    var SVGNS = "http://www.w3.org/2000/svg";
    var cells = [];
    for (var row = 0; row < 9; row++) {
      for (var col = 0; col < 11; col++) {
        var x = 428 + col * 48, y = 220 + row * 48;
        var r = document.createElementNS(SVGNS, "rect");
        r.setAttribute("x", x); r.setAttribute("y", y);
        r.setAttribute("width", 36); r.setAttribute("height", 36);
        r.setAttribute("class", "rt10-cell");
        cellsG.appendChild(r);
        cells.push({ el: r, wave: col + row });
      }
    }

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* ============ Scene 1 (0.0–6.0s): kicker, then K draws on "regional theorem" ============ */
    tl.fromTo($("kicker"), { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.30);

    var outline = $("region-outline");
    var oLen = outline.getTotalLength();
    outline.style.strokeDasharray = String(oLen);
    outline.style.strokeDashoffset = String(oLen);
    gsap.set(outline, { fillOpacity: 0 });
    tl.to(outline, { strokeDashoffset: 0, duration: 1.9, ease: "power2.inOut" }, 3.80);
    tl.to(outline, { fillOpacity: 1, duration: 0.8, ease: "power1.out" }, 5.30);

    /* ============ Scene 2 (6.0–13.0s): cells certify, M ≻ 0, checker chip ============ */
    // label on "certified region" (VO 7.44s)
    tl.fromTo($("klabel"), { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.44);

    // wave fill across K (stat-bars-and-fills stagger, wave = col + row)
    cells.forEach(function (c) {
      tl.fromTo(c.el, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" },
        { opacity: 0.45, scale: 1, duration: 0.4, ease: "power2.out" },
        7.50 + c.wave * 0.085);
    });

    // "M ≻ 0" lands on "positive definite" (VO 8.72s)
    tl.fromTo($("mpos"), { opacity: 0, y: 22, filter: "blur(8px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.65, ease: "power3.out" }, 8.85);
    // sub-line on "a proof object" (VO 10.18s)
    tl.fromTo($("mpos-sub"), { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.20);
    // checker chip on "checkable by a tiny program" (VO 11.29s)
    tl.fromTo($("chip"), { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 11.35);

    /* ============ Scene 3 (13.0–18.5s): the corridor arrow — the open construction ============ */
    // axis fades in as the act opens
    tl.fromTo($("axis"), { opacity: 0 },
      { opacity: 1, duration: 0.6, ease: "power1.out" }, 14.20);

    // dashed corridor path draws via its reveal mask on "One construction problem remains"
    var reveal = $("arrow-reveal");
    var rLen = reveal.getTotalLength();
    reveal.style.strokeDasharray = String(rLen);
    reveal.style.strokeDashoffset = String(rLen);
    tl.to(reveal, { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" }, 14.50);

    // open arrowhead lands as the draw finishes
    tl.fromTo($("arrow-head"), { opacity: 0 },
      { opacity: 1, duration: 0.35, ease: "power1.out" }, 16.30);

    // depth label after "window sequence" (VO 17.71s)
    tl.fromTo($("hlabel"), { opacity: 0, x: -14 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 17.75);

    // question line reveals per word on the VO
    var qWords = Array.prototype.slice.call(document.querySelectorAll(".rt10-qword"));
    var qAt = [16.68, 16.80, 17.39, 17.71, 18.20, 18.56, 19.48, 19.89, 20.44];
    qWords.forEach(function (w, i) {
      tl.fromTo(w, { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, qAt[i]);
    });

    // keyword glow on "cofinal," (VO 18.56s)
    tl.to($("cofinal"), { color: ACCENT, duration: 0.35, ease: "power2.out" }, 18.60);
    tl.fromTo($("cofinal"),
      { textShadow: "0 0 0px rgba(56,189,248,0)" },
      { textShadow: "0 0 22px rgba(56,189,248,0.45)", duration: 0.35, ease: "power1.out" }, 18.60);

    // the dashed corridor keeps flowing — the one living element during holds
    tl.to($("arrow-dash"), { strokeDashoffset: -96, duration: 9.2, ease: "none" }, 16.80);

    /* ============ Scene 4 (18.5–26.0s): dim, then the dry closing beats ============ */
    var dimEls = [$("diagram"), $("kicker"), $("klabel"), $("mpos"), $("mpos-sub"),
                  $("chip"), $("hlabel"), $("question")];
    tl.to(dimEls, { opacity: 0.14, duration: 0.8, ease: "power1.inOut" }, 20.95);

    // beat 1: "The proof object is ready for audit." per-word on the VO
    var b1Words = Array.prototype.slice.call($("beat1").querySelectorAll(".rt10-word"));
    gsap.set(b1Words, { opacity: 0 });
    var b1At = [21.26, 21.34, 21.62, 22.09, 22.23, 22.45, 22.68];
    b1Words.forEach(function (w, i) {
      tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, b1At[i]);
    });

    // keyword glow on "audit." (accent ink lives in the CSS; bloom on its cue)
    tl.fromTo($("audit"),
      { textShadow: "0 0 0px rgba(56,189,248,0)" },
      { textShadow: "0 0 24px rgba(56,189,248,0.4)", duration: 0.4, ease: "power1.out" }, 22.70);

    // beat 2: "— the RH quantifier is not." hard-cut word reveal, lands dry
    var b2Words = Array.prototype.slice.call($("beat2").querySelectorAll(".rt10-word"));
    var b2At = [23.31, 23.43, 23.77, 24.36, 24.48];
    b2Words.forEach(function (w, i) {
      tl.set(w, { opacity: 1 }, b2At[i]);
    });

    // full-span anchor — timeline covers the whole 26.0s frame
    tl.to({}, { duration: 26.0 }, 0);

    window.__timelines[ID] = tl;
  })();
</script>
