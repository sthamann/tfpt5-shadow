<script>
  (function () {
    var ID = "09-ehrlicher-stand";
    var ACCENT = "#38bdf8";
    function $(s) { return document.getElementById("ehrlicher-stand-09-" + s); }
    function words(el) { return Array.prototype.slice.call(el.querySelectorAll(".ehrlicher-stand-09-word")); }

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* ============ Scene 1 (0.0–1.8s): "Kein Beweis." lands alone ============ */
    var kbWords = words($("kb"));
    tl.fromTo(kbWords[0], { opacity: 0, y: 18, filter: "blur(8px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.10);
    tl.fromTo(kbWords[1], { opacity: 0, y: 18, filter: "blur(8px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.40);

    /* ============ Scene 2 (1.8–5.4s): sub-line reveals per word on the VO ============ */
    var subWords = words($("sub"));
    var subAt = [1.82, 2.22, 2.56, 2.95, 3.60, 3.78, 4.02];
    subWords.forEach(function (w, i) {
      tl.fromTo(w, { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, subAt[i]);
    });

    /* ============ Scene 3 (5.4–9.3s): waterfall seam (cut catalog #4) ============ */
    // Exit: every beat-1 word rips leftward on power4.in; fade completes at ~28% of travel.
    var exitWords = kbWords.concat(subWords);
    var EXIT_START = 5.10, EXIT_STAGGER = 0.022;
    exitWords.forEach(function (w, i) {
      var t = EXIT_START + i * EXIT_STAGGER;
      tl.to(w, { x: -230, duration: 0.34, ease: "power4.in" }, t);
      tl.to(w, { opacity: 0, duration: 0.18, ease: "power1.in" }, t);
    });

    // Entry: line 1 cascades in mid-flight, mirrored back half of the composite
    // (power4.out), waterfall stagger with shrinking gaps (0.05 × 0.84^i).
    var l1Words = words($("b2l1"));
    gsap.set(l1Words, { x: 230, opacity: 0 }); // pre-set — un-started words must not sit at rest
    var entryT = 5.30, gap = 0.05;
    l1Words.forEach(function (w) {
      tl.fromTo(w, { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, entryT);
      entryT += gap;
      gap *= 0.84;
    });

    // Keyword glow on "klein." (VO 6.71s) — accent ink + soft bloom + gentle scale
    tl.to($("klein"), { color: ACCENT, scale: 1.06, duration: 0.35, ease: "power2.out" }, 6.70);
    tl.fromTo($("klein"),
      { textShadow: "0 0 0px rgba(56,189,248,0)" },
      { textShadow: "0 0 26px rgba(56,189,248,0.45)", duration: 0.35, ease: "power1.out" }, 6.70);

    // "— und nie so präzise." appends by hard-cut word reveal (VO "präzise" 7.74s)
    var l2Words = words($("b2l2"));
    var l2At = [7.50, 7.62, 7.74, 7.86];
    l2Words.forEach(function (w, i) {
      tl.set(w, { opacity: 1 }, l2At[i]);
    });

    /* ============ Scene 4 (9.3–13.5s): statements yield upward, stats cascade ============ */
    tl.to($("beat2"), { y: -130, scale: 0.9, duration: 0.55, ease: "power2.in" }, 9.30);
    tl.to($("beat2"), { opacity: 0, duration: 0.5, ease: "none" }, 9.32);

    // stat segments cascade on their cues
    var segs = [$("seg1"), $("seg2"), $("seg3")];
    var segAt = [9.42, 11.15, 12.15];
    segs.forEach(function (s, i) {
      tl.fromTo(s, { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, segAt[i]);
    });

    // counter ticks up to 893 on "nine hundred" — swap only on change
    var countEl = $("count");
    var counter = { v: 0 }, lastShown = -1;
    tl.to(counter, {
      v: 893, duration: 0.75, ease: "power2.out",
      onUpdate: function () {
        var v = Math.round(counter.v);
        if (v !== lastShown) { lastShown = v; countEl.textContent = "" + v; }
      }
    }, 9.50);

    // callback line draws (svg-path-draw: measured getTotalLength, power2.out)
    var critLine = $("critline");
    var lineLen = critLine.getTotalLength();
    critLine.style.strokeDasharray = String(lineLen);
    critLine.style.strokeDashoffset = String(lineLen);
    tl.to(critLine, { strokeDashoffset: 0, duration: 1.25, ease: "power2.out" }, 10.45);

    // zeros lock in silently along the line
    var zeros = Array.prototype.slice.call(document.querySelectorAll(".ehrlicher-stand-09-zero"));
    gsap.set(zeros, { scale: 0, opacity: 0 });
    zeros.forEach(function (z, i) {
      tl.fromTo(z, { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.3)" }, 11.75 + i * 0.13);
    });

    /* ============ Scene 5 (13.5–15.5s): end card locks, gentle settle ============ */
    // stat line steps up into a kicker position
    tl.to($("statrow"), { y: -138, scale: 0.6, duration: 0.6, ease: "power3.inOut" }, 13.55);

    // "Die Prime Front" arrives oversized and retracts into the focal plane
    // (inverse zoom-through entry — an arrival, not a progression)
    tl.fromTo($("title"),
      { opacity: 0, scale: 1.12, filter: "blur(8px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.75, ease: "expo.out" }, 13.92);

    // mono sub-line
    tl.fromTo($("url"), { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" }, 14.55);

    // macro move: one slow decelerating push under the whole shot — at rest by ~14.5s,
    // so the final frame is genuinely still (this frame owns the real exit: stillness)
    tl.fromTo($("stage"), { scale: 1 },
      { scale: 1.014, duration: 14.5, ease: "power1.out", transformOrigin: "50% 44%" }, 0);

    // full-span anchor — timeline covers the whole 15.504s frame
    tl.to({}, { duration: 15.504 }, 0);

    window.__timelines[ID] = tl;
  })();
