  korridorTl.to("#korridor-rail-top", { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 2.5);

  /* ——— Scene 2 (2.9–5.7s): edge labels + resolvent tag ——— */

  korridorTl.fromTo("#korridor-tag", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.35);

  /* ——— Scene 3 (5.7–11.9s): the feint — glide in, drift to the rail, brake, settle inside ——— */
  korridorTl.fromTo(
    "#korridor-dot",

  gsap.utils.toArray(".korridor-scalenum").forEach((el, i) => {
    korridorTl.fromTo(el, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 9.8 + i * 0.06);

    { t: 2.05, text: "Explain the selection inside the corr" },
    { t: 2.2, text: "Explain the selection inside the corridor" },
    { t: 2.55, text: "Explain the selection inside the corridor." },
  ];
  function korridorTextAt(time) {
    for (let i = korridorSeq.length - 1; i >= 0; i--) {
      if (time >= korridorSeq[i].t) return korridorSeq[i].text;
    }
    return "";
  }
  const korridorQText = document.getElementById("korridor-q-text");
  const korridorTypeDriver = { t: 0 };
  korridorTl.to(
    korridorTypeDriver,
    {
      t: KORRIDOR_TYPE_SPAN,
      duration: KORRIDOR_TYPE_SPAN,
      ease: "none",
      onUpdate: () => {
        korridorQText.textContent = korridorTextAt(korridorTypeDriver.t);
      },
    },
    KORRIDOR_TYPE_AT,
  );
  /* caret blink — deterministic sin square wave on the same timeline */
  const korridorCaret = document.getElementById("korridor-caret");
  const korridorBlink = { p: 0 };
  korridorTl.to(
    korridorBlink,
    {
      p: Math.PI * 12, /* 6 cycles over the typing span */
      duration: KORRIDOR_TYPE_SPAN,
      ease: "none",
      onUpdate: () => {
        korridorCaret.style.opacity = Math.sin(korridorBlink.p) > 0 ? "1" : "0";
      },
    },
    KORRIDOR_TYPE_AT,
  );

  /* one-shot ambient glow on the dot (immediateRender:false — dormant until its cue) */
  korridorTl.fromTo(
    "#korridor-halo",
    { opacity: 0.55, scale: 0.35 },
    { opacity: 0, scale: 2.4, duration: 1.5, ease: "power2.out", immediateRender: false },
    16.7,
  );
  /* subtle deterministic jitter on the held dot — integer sine cycles, ends at rest */
  const korridorJitterEl = document.getElementById("korridor-dot-jitter");
  const korridorJitter = { p: 0 };
  korridorTl.to(
    korridorJitter,
    {
      p: Math.PI * 8, /* 4 cycles */
      duration: 2.98,
      ease: "none",
      onUpdate: () => {
        gsap.set(korridorJitterEl, {
          y: 2.4 * Math.sin(korridorJitter.p),
          x: 1.5 * Math.sin(korridorJitter.p / 2),
        });
      },
    },
    16.6,
  );

  window.__timelines["08-korridor"] = korridorTl;
</script>
</template>
