  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const ID = "04-detektor-falsifikator";
      const DUR = 24.36;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;

      /* ---------- initial offsets (build-time, deterministic) ---------- */
      // instrument card starts centered (final left position + 450px offset)
      gsap.set("#f04-inst", { x: 450 });
      // matched-filter card waits fully below the frame (top 260 + 840 = 1100 > 1080)
      gsap.set("#f04-mf", { y: 840 });

      /* ---------- needle: base angle + living micro-jitter (svg-icon-enrichment) ---------- */
      const needle = document.getElementById("f04-needle");
      const needleState = { deg: -9 }; // negative = tip above the zero hairline
      const jitter = { p: 0 };
      const JITTER_AMP = 0.7;
      const renderNeedle = () => {
        const wobble =
          Math.sin(jitter.p) * JITTER_AMP + Math.sin(jitter.p * 2.63 + 1.3) * 0.28;
        needle.setAttribute("transform", `rotate(${needleState.deg + wobble} 130 200)`);
      };
      renderNeedle();
      // continuous jitter phase across the whole shot — the instrument lives
      tl.to(
        jitter,
        { p: Math.PI * 2 * 26, duration: DUR, ease: "none", onUpdate: renderNeedle },
        0,
      );

      /* ---------- global clock driver: callout chip discrete states ---------- */
      const CALLOUT_SEQ = [
        { t: 0.0, text: "" },
        { t: 13.0, text: "Census: 12 off-line zeros" },
        { t: 13.7, text: "Census: 12 off-line zeros · λ ratio 0.803 predicted" },
      ];
      const calloutEl = document.getElementById("f04-callout-text");
      let lastCallout = null;
      const clock = { t: 0 };
      tl.to(
        clock,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: () => {
            let txt = "";
            for (let i = CALLOUT_SEQ.length - 1; i >= 0; i--) {
              if (clock.t >= CALLOUT_SEQ[i].t) {
                txt = CALLOUT_SEQ[i].text;
                break;
              }
            }
            if (txt !== lastCallout) {
              calloutEl.textContent = txt;
              lastCallout = txt;
            }
          },
        },
        0,
      );

      /* ================= Scene 1 (0.0–2.8s): instrument centered ================= */
      tl.fromTo(
        "#f04-inst",
        { opacity: 0, y: 36, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
        0.05,
      );
      tl.fromTo(
        "#f04-chrome",
        { opacity: 0 },
        { opacity: 1, duration: 0.7, ease: "power2.out" },
        0.3,
      );
      // keyword glow on the label at "Detektor" (1.2s)
      tl.to(
        "#f04-inst-label",
        {
          color: "#38bdf8",
          textShadow: "0 0 26px rgba(56,189,248,0.55)",
          duration: 0.4,
          ease: "power2.out",
        },
        1.2,
      );
      tl.to(
        "#f04-inst-label",
        { textShadow: "0 0 12px rgba(56,189,248,0.18)", duration: 0.8, ease: "power2.inOut" },
        1.7,
      );

      /* ================= Scene 2 (2.8–9.2s): 60/40 split, Ramanujan passes ================= */
      tl.to("#f04-inst", { x: 0, duration: 0.9, ease: "power3.inOut" }, 2.8);
      // row 1 slides in on "Ramanujan-Graphen" (4.6s)
      tl.fromTo(
        "#f04-row1",
        { opacity: 0, x: 70 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        4.6,
      );
      // progress stroke runs through (stat-bars-and-fills)
      tl.fromTo(
        "#f04-fill1",
        { scaleX: 0 },
        { scaleX: 1, duration: 2.5, ease: "power1.inOut" },
        4.9,
      );
      // badge hard-flips to ✓ on "bestehen den Test" (7.6s); needle stays calm positive
      tl.set("#f04-badge1-pending", { opacity: 0 }, 7.6);
      tl.set("#f04-badge1-done", { opacity: 1 }, 7.6);
      tl.set("#f04-badge1", { borderColor: "#38bdf8" }, 7.6);
      tl.fromTo(
        "#f04-badge1-done",
        { scale: 1.35 },
        { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false },
        7.6,
      );

      /* ================= Scene 3 (9.2–14.6s): Epstein breaks ================= */
      tl.fromTo(
        "#f04-row2",
        { opacity: 0, x: 70 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        9.4,
      );
      tl.fromTo(
        "#f04-fill2",
        { scaleX: 0 },
        { scaleX: 1, duration: 2.15, ease: "power1.inOut" },
        9.7,
      );
      // "bricht" (11.9s): needle tips below the zero hairline — fast but damped
      tl.to(
        needleState,
        { deg: 13, duration: 0.95, ease: "back.out(1.8)", onUpdate: renderNeedle },
        11.9,
      );
      tl.set("#f04-badge2-pending", { opacity: 0 }, 11.9);
      tl.set("#f04-badge2-done", { opacity: 1 }, 11.9);
      tl.set("#f04-badge2", { borderColor: "#e2e8f0" }, 11.9);
      tl.fromTo(
        "#f04-badge2-done",
        { scale: 1.35 },
        { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false },
        11.9,
      );
      // readout hard-swaps to the negative state
      tl.set("#f04-readout-pos", { opacity: 0 }, 12.0);
      tl.set("#f04-readout-neg", { opacity: 1 }, 12.0);
      // "vorhergesagt" (13.0s): callout chip hard-cut reveal (text via discrete states above)
      tl.fromTo(
        "#f04-callout",
        { opacity: 0 },
        { opacity: 1, duration: 0.05, ease: "none" },
        13.0,
      );

      /* ============ Scene 4 (14.6–21.4s): cut-the-curve to the matched-filter card ============ */
      // velocity-matched: checklist stage shoves up while the card rises from below
      tl.to("#f04-stage", { y: -620, opacity: 0.16, duration: 0.95, ease: "power2.inOut" }, 14.55);
      tl.to("#f04-mf", { y: 0, duration: 0.95, ease: "power2.inOut" }, 14.55);

      // formula types character-wise from "Matched Filter" (15.0s) — smooth slice
      const FORMULA = "x_mf[j] = cos(ω_j γ₀) · sinh(ω_j δ)";
      const formulaEl = document.getElementById("f04-formula");
      const typed = { v: 0 };
      tl.to(
        typed,
        {
          v: FORMULA.length,
          duration: 2.3,
          ease: "power1.inOut",
          onUpdate: () => {
            formulaEl.textContent = FORMULA.substring(0, Math.floor(typed.v));
          },
        },
        15.0,
      );
      // block cursor blink — deterministic sin square wave
      const cursorEl = document.getElementById("f04-cursor");
      const blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 13,
          duration: DUR - 14.6,
          ease: "none",
          onUpdate: () => {
            cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        14.6,
      );

      // witness line per-word on "nachrechenbaren Zeugen" (18.8s) — content-aware schedule
      const words = Array.from(document.querySelectorAll(".f04-w"));
      const W_BASE = 0.1;
      const W_SEC_PER_CHAR = 0.012;
      let cum = 0;
      const wordStarts = words.map((w) => {
        const start = cum;
        cum += W_BASE + w.textContent.trim().length * W_SEC_PER_CHAR;
        return start;
      });
      const witness = { t: 0 };
      tl.to(
        witness,
        {
          t: cum,
          duration: cum,
          ease: "none",
          onUpdate: () => {
            for (let i = 0; i < words.length; i++) {
              words[i].style.opacity = witness.t >= wordStarts[i] ? "1" : "0";
            }
          },
        },
        18.8,
      );

      /* ================= Scene 5 (21.4–24.36s): the statement lands ================= */
      // background cards dim (opacity only, no blur rig)
      tl.to("#f04-mf", { y: -150, opacity: 0.22, duration: 0.8, ease: "power2.inOut" }, 21.9);
      tl.to("#f04-stage", { opacity: 0.08, duration: 0.8, ease: "power2.inOut" }, 21.9);
      tl.to("#f04-chrome", { opacity: 0.4, duration: 0.8, ease: "power2.inOut" }, 21.9);
      // "falsifizierbar" (22.4s)
      tl.fromTo(
        "#f04-statement",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        22.4,
      );
      tl.to(
        "#f04-statement-key",
        {
          color: "#38bdf8",
          textShadow: "0 0 30px rgba(56,189,248,0.5)",
          duration: 0.6,
          ease: "power2.out",
        },
        22.9,
