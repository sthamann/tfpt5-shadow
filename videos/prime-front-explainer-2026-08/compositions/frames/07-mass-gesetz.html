<script>
  (() => {
    const DUR = 16.176;
    const byId = (id) => document.getElementById(id);

    /* ---- build the von-Mangoldt ladder from data (dynamic-content-sequencing:
       start times computed once from the array, never hardcoded per item) ---- */
    const LADDER = [
      { f: 0.231, h: 36,  pp: false, label: "log 2" },
      { f: 0.367, h: 57,  pp: false, label: "log 3" },
      { f: 0.463, h: 36,  pp: true,  label: null },
      { f: 0.537, h: 84,  pp: false, label: "log 5" },
      { f: 0.649, h: 101, pp: false, label: "log 7" },
      { f: 0.694, h: 36,  pp: true,  label: null },
      { f: 0.733, h: 57,  pp: true,  label: null },
      { f: 0.800, h: 125, pp: false, label: "log 11" },
      { f: 0.856, h: 133, pp: false, label: "log 13" },
      { f: 0.926, h: 36,  pp: true,  label: null },
      { f: 0.946, h: 147, pp: false, label: null },
      { f: 0.983, h: 153, pp: false, label: "log 19" },
    ];
    const LADDER_START = 2.5;
    const LADDER_STEP = 0.11;
    const LADDER_W = 1080;
    const ladderEl = byId("f07mg-ladder");
    const bars = [];
    const axisLabels = [];
    LADDER.forEach((d) => {
      const bar = document.createElement("div");
      bar.className = "f07mg-bar" + (d.pp ? " f07mg-bar-pp" : "");
      bar.style.left = Math.round(d.f * LADDER_W) + "px";
      bar.style.height = d.h + "px";
      ladderEl.appendChild(bar);
      bars.push(bar);
      if (d.label) {
        const lab = document.createElement("span");
        lab.className = "f07mg-axislabel";
        lab.style.left = Math.round(d.f * LADDER_W) + 2 + "px";
        lab.textContent = d.label;
        ladderEl.appendChild(lab);
        axisLabels.push(lab);
      } else {
        axisLabels.push(null);
      }
    });

    /* ---- svg-path-draw setup: measure real geometry ---- */
    const SEGS = ["f07mg-seg0", "f07mg-seg1", "f07mg-seg2", "f07mg-seg3"].map(byId);
    SEGS.forEach((p) => {
      const len = p.getTotalLength() * 1.02;
      p.style.strokeDasharray = String(len);
      p.style.strokeDashoffset = String(len);
    });

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const GLOW_ON = "0 0 26px rgba(56,189,248,0.85)";
    const GLOW_SETTLE = "0 0 12px rgba(56,189,248,0.35)";
    const GLOW_OFF = "0 0 0px rgba(56,189,248,0)";
    const glow = (target, at) => {
      tl.fromTo(target, { textShadow: GLOW_OFF }, {
        textShadow: GLOW_ON, color: "#38bdf8", duration: 0.35, ease: "power2.out",
      }, at);
      tl.to(target, { textShadow: GLOW_SETTLE, duration: 0.5, ease: "power1.out" }, at + 0.5);
    };

    /* ---- macro move: slow downward camera push (content drifts up),
       the dataviz-countup vertical flow from counting to curve ---- */
    tl.fromTo("#f07mg-drift", { y: 0 }, { y: -22, duration: DUR, ease: "none" }, 0);

    /* ================= Act 1 (0.0-2.3s): shell counters tick ================= */
    tl.fromTo("#f07mg-chrome", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.05);
    tl.fromTo("#f07mg-kicker1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.1);

    /* counting-dynamic-scale, small: value counts while scale grows, shared ease */
    const SHELLS = [240, 2160, 6720];
    const COUNT_DUR = 0.55;
    SHELLS.forEach((target, i) => {
      const at = 0.15 + i * 0.4;
      const numEl = byId("f07mg-chipnum" + i);
      const state = { v: 0 };
      tl.fromTo("#f07mg-chip" + i, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, at);
      tl.to(state, {
        v: target, duration: COUNT_DUR, ease: "power3.out",
        onUpdate: () => { numEl.textContent = String(Math.round(state.v)); },
      }, at);
      tl.fromTo(numEl, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, at);
    });
    tl.fromTo("#f07mg-chip3", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.7);

    /* ============ Act 2 (2.3-7.2s): the Lambda ladder falls out ============ */
    tl.fromTo("#f07mg-kicker2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.35);
    tl.fromTo("#f07mg-ladderbase", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 2.4);
    bars.forEach((bar, i) => {
      const at = LADDER_START + i * LADDER_STEP;
      tl.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out" }, at);
      if (axisLabels[i]) {
        tl.fromTo(axisLabels[i], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at + 0.18);
      }
    });

    /* "zirkelfrei" (3.9s): keyword glow */
    tl.fromTo("#f07mg-zirkelfrei", { opacity: 0, scale: 0.9 }, {
      opacity: 1, scale: 1, borderColor: "#38bdf8", duration: 0.35, ease: "power2.out",
    }, 3.9);
    glow("#f07mg-zirkelfrei", 3.9);

    /* "ablesen" (5.8s): formula chip snaps in */
    tl.fromTo("#f07mg-formulachip", { opacity: 0, scale: 0.92 }, {
      opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)",
    }, 5.8);

    /* ===== Act 3 (7.2-11.8s): gamma flow, singularities caught by atoms ===== */
    tl.fromTo("#f07mg-kicker3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 7.25);

    /* per slot: guide appears, segment draws steepening into the slot,
       atom drops in and catches it, next segment runs on smoothly */
    const CYCLES = [
      { guideAt: 7.4,  segAt: 7.5,  segDur: 0.7,  atomAt: 8.15 },
      { guideAt: 8.35, segAt: 8.45, segDur: 0.7,  atomAt: 9.1 },
      { guideAt: 9.3,  segAt: 9.4,  segDur: 0.7,  atomAt: 10.05 },
    ];
    CYCLES.forEach((c, i) => {
      tl.fromTo("#f07mg-guide" + i, { opacity: 0 }, { opacity: 0.55, duration: 0.3, ease: "power1.out" }, c.guideAt);
      tl.to(SEGS[i], { strokeDashoffset: 0, duration: c.segDur, ease: "none" }, c.segAt);
