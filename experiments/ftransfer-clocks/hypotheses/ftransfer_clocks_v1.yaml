# ---------------------------------------------------------------------------
# THE FOUR FROZEN CLOCKS -- exactly one physical clock per solver, fixed NOW.
# Each channel freezes: (i) the operational clock definition, (ii) the clock
# gauge (the single identification between native flow time and the clock;
# guarded by kill K2), (iii) the dictionary into the common chart sigma.
# No channel owns any further time freedom.
# ---------------------------------------------------------------------------
clocks:
  F_pole:                                   # Koide
    clock: proper_time
    symbol: tau
    operational_definition: >
      tau is the Lorentz proper time in the rest frame of the charged-lepton
      one-particle state.  Operational realization: the phase clock of the
      propagator pole -- a lepton of pole mass m_l at rest evolves as
      exp(-i*m_l*tau) (hbar = c = 1), and the PDG pole mass is the real part
      of the propagator pole position (on-shell scheme).  The Koide chart is
      therefore the ON-SHELL chart: Q = 2/3 is a pole-mass statement, not a
      running-mass statement (scheme content, tested in FTC.01.K below).
      The proper-lifetime clock of the unstable leptons is the equivalent
      secondary realization; the contract uses the phase clock because the
      Koide observable is built from pole masses.
    clock_chart: "x1 = ln(m_ref * tau)      # proper-phase e-folds; m_ref any frozen lepton mass"
    clock_gauge: >
      FROZEN IDENTIFICATION (the only one; changing it post hoc = kill K2):
      one unit of v99 seam-flow time = one e-fold of proper phase,
      t_v99 = x1 + const.  The trajectory is then q Moebius in
      u = e^{Delta*x1} = (m_ref*tau)^Delta.
    dictionary_to_sigma: "sigma = -x1 + const   (scale-time inversion mu ~ 1/tau; slope -1)"
    base_point: "the on-shell locus of the heaviest lepton, sigma* = ln(m_tau/M_Z)"

  F_Boltzmann:                              # eta_B / leptogenesis washout
    clock: inverse_temperature
    symbol: beta
    operational_definition: >
      beta = 1/T with T the photon-plasma temperature of the FRW radiation
      era, realized by the frozen adiabatic chart g_{*s}(T)*a^3*T^3 = const
      anchored at the FIRAS CMB monopole T_0 = 2.7255(6) K (Fixsen 2009).
      Window: the washout window z = M_1*beta in [1, 10]; the seesaw scale
      M_1 = M_R*phi0^4 is an external anchor (v184) and enters only the
      affine offset.
    clock_chart: "x2 = ln(M_1 * beta)       # beta e-folds"
    clock_gauge: >
      FROZEN IDENTIFICATION (changing it post hoc = kill K2): one unit of
      washout seam time = one e-fold of beta; the v425 contraction acts with
      multiplier (2/3)^6 per beta e-fold.  The named, EXCLUDED alternative
      (the z-linear reading, contraction per unit z = M_1*beta) is recorded
      here so it cannot be adopted after the fact.
    dictionary_to_sigma: "sigma = -ln(beta*M_Z) + const   (thermal matching mu = xi*T, xi = 1 frozen; slope -1)"
    base_point: "z = 1 (onset of the washout window)"

  F_QCD:                                    # m_p/m_e via dimensional transmutation
    clock: rg_time
    symbol: t
    operational_definition: >
      t = ln(mu/mu_0) in the MS-bar scheme with mu_0 = M_Z = 91.1880 GeV
      frozen.  The contract object is the 1-loop projective truncation
      dalpha_s/dt = -(b0/(2*pi))*alpha_s^2 with b0 = 7 (n_f = 6; the carrier
      datum b3 = -7, v159), valid on the frozen window mu in [m_t, 1 TeV],
      m_t = 172.57 GeV.  NAMED LIMITATION (frozen, no re-choice): at >= 2
      loops the flow is cubic and not a Riccati/Moebius flow at all -- the
      jet test lives at the order where the flow IS projective; the 10%
      overlay tolerance below covers the truncation honestly.
    clock_chart: "t itself (already a log chart)"
    clock_gauge: "none needed: the native flow variable IS the clock (identity gauge, frozen)"
    dictionary_to_sigma: "sigma = t   (identity; slope +1)"
    base_point: "sigma_t = ln(m_t/M_Z)"

  F_relic:                                  # axion misalignment relic
    clock: cosmological_efolds
    symbol: ln_a
    operational_definition: >
      N = ln a, normalized a_0 = 1 today; realized by the Planck 2018 flat
      LCDM background (H_0 = 67.36(54) km/s/Mpc, Omega_m = 0.3153(73),
      TT,TE,EE+lowE+lensing) plus the radiation-era T(a) chart above.
      Channel trajectory: misalignment angle theta(ln a) = theta_i constant
      before the oscillation onset 3H(T_osc) = m_a; the adiabatic invariant
      N_a = n_a*a^3 constant after it.
    clock_chart: "ln a itself"
    clock_gauge: "none needed: the flow is frozen (identity element, v632); no gauge can be hidden here"
    dictionary_to_sigma: >
      sigma = -ln a - (1/3)*ln(g_{*s}(T)/g_{*s}(T_0)) + const (entropy chart;
      slope -1 up to the frozen g_{*s} drift; validity tolerance below).
    base_point: "the oscillation onset 3H(T_osc) = m_a"
    honesty: >
      The jets of this channel are DEGENERATE in its frozen clock (constant
      trajectory; v578/v632/v723 P3): it carries no class information, and
      its whole physical content is the anchor theta_i.  The channel is
      scored ONLY on kill criteria K2/K3 and dictionary validity -- it can
      kill the contract, it can never carry it.  Fixed-point membership of
      the constant is NOT scored (with a free per-channel Moebius frame it
      would be vacuous; radical honesty forbids scoring a vacuous check).

# ---------------------------------------------------------------------------
# The common projective connection and the transport protocol (frozen).
# ---------------------------------------------------------------------------
common_connection:
  chart: "sigma = ln(mu/M_Z)   -- the one-dimensional log-scale line"
  dictionaries: >
    All four clock dictionaries above are affine in their log charts with
    slopes {-1, -1, +1, -1} FROZEN; every dimensionful anchor (m_ref, M_1,
    xi, mu_0, a_0) enters as an affine offset only and drops out of every
    Schwarzian and every conjugacy class.  The contract therefore tests
    exactly the anchor-FREE jet content -- consistent with the v723 anchor
    census staying external.  Orientation is irrelevant to the class data
    (a hyperbolic element is PGL2-conjugate to its inverse; slope^2 enters
    the cocycle).
  transport: >
    Per channel: export the order-3 jet (y, y', y'', y''') of the native
    trajectory in its OWN frozen physical clock at the frozen base point;
    transport into sigma by the chain rule / Schwarzian cocycle
    {y o h, sigma} = ({y,x} o h)*(h')^2 + {h,sigma} with h the frozen
    dictionary.  All kernel steps symbolic (sympy exact); floats only at
    the data interfaces of FTC.01.
  frames: >
    Each channel's observable coordinate y lives on P^1 in a FROZEN Moebius
    frame declared above (q with fixed points {2,5}; y_B with {0,inf};
    alpha_s with the double point {0}; theta resp. N_a).  Class data are
    frame-independent (checked by control FTC.C3); frames are frozen anyway
    so that nothing can be re-fit.

# ---------------------------------------------------------------------------
# THE PREREGISTERED PREDICTION (the contract itself).
# ---------------------------------------------------------------------------
prediction:
  id: FTC.P1
  statement: >
    Under the four frozen clocks and frozen dictionaries there exists ONE
    constant-coefficient Riccati equation on the common chart sigma,
    dy/dsigma = c0 + c1*y + c2*y^2, such that all non-degenerate transported
    channel jets satisfy it.  Equivalently (theorem: all non-constant
    solutions of one such equation share the constant Schwarzian
    S = -(c1^2 - 4*c0*c2)/2): the transported Schwarzians of F_pole,
    F_Boltzmann and F_QCD are EQUAL, i.e. the v578 native quadruple
    {-Delta^2/2, -Delta^2/2, 0, degenerate} collapses into ONE PGL2 class
    under the fixed physical clocks.  The seam channels transport to
    {q,sigma} = {y_B,sigma} = -Delta^2/2 (exact, by the exp_lemma); the
    prediction therefore forces the transported QCD Schwarzian to equal
    -Delta^2/2 = -2.959235170076978.  If it does not, the contract DIES.
  degenerate_channel: >
    F_relic contributes no Schwarzian; it enters the prediction only through
    the kill criteria (its frozen clock must suffice, K3, and its dictionary
    must hold, FTC.01.R).

# ---------------------------------------------------------------------------
# KILL CRITERIA (frozen; any one fired => verdict = the corresponding kill).
# ---------------------------------------------------------------------------
kill_criteria:
  K1:
    name: NO-COMMON-CONNECTION
    definition: >
      With the four clocks and dictionaries exactly as frozen above, the
      transported Schwarzians of the non-degenerate channels differ
      (symbolic inequality; no tolerance -- the kernel is exact).  Duty of
      the executor on kill: exhibit, per failing pair, the reparametrization
      h that WOULD be needed to match them (solving the cocycle equation),
      so the forbidden freedom is documented explicitly.
  K2:
    name: FREE-REPARAM-NEEDED
    definition: >
      A pass is achievable only by modifying, per channel and after the
      freeze, a clock gauge or dictionary (any re-sloped or non-affine
      dictionary, any change of the frozen identifications: the two e-fold
      gauges, xi, mu_0, the scheme, the window, a frame re-fit).  Machine
      form: the executor runs against the byte-frozen YAML (sha256 recorded);
      any deviation needed for a pass = K2.
  K3:
    name: SECOND-CLOCK-NEEDED
    definition: >
      Any channel requires a second time variable to express its exported
      jet (e.g. F_QCD needing both mu and T, or F_pole needing both tau and
      mu).  Each export must be a function of exactly ONE clock; the
      executor asserts this structurally on the symbolic exports.

