tests:
  FTC.01:
    name: dictionary validity (data-driven; per channel)
    parts:
      FTC.01.K: "Koide base point within tolerance AND the scheme_check above"
      FTC.01.B: "radiation certificate + g_{*s} chart consistency on the washout window"
      FTC.01.Q: "1-loop overlay within 10% on [m_t, 1 TeV]"
      FTC.01.R: "relic entropy-chart slope within tolerance"
    on_failure: CONSTRUCTION-FAIL (a broken dictionary is not a physics kill)
  FTC.02:
    name: THE one-class test (the contract)
    procedure: >
      Symbolic order-3 jet export per channel in its frozen clock; cocycle
      transport into sigma; symbolic equality test of the transported
      Schwarzians of F_pole, F_Boltzmann, F_QCD; verdict per FTC.P1 and the
      kill criteria.
  FTC.03:
    name: degeneracy honesty (relic + single-clock assertion)
    procedure: >
      Assert the relic jets are degenerate in the frozen clock and that NO
      channel export references a second time variable (K3 watch,
      structural/symbolic).
  FTC.C1:
    name: calibration control (must pass)
    procedure: >
      With identity dictionaries (native clocks), the machinery must
      reproduce the v578 quadruple {-Delta^2/2, -Delta^2/2, 0, degenerate}
      EXACTLY -- validates the transport code against the frozen corpus.
  FTC.C2:
    name: swap control (must fail)
    procedure: >
      Deliberately assign the QCD clock dictionary to the Koide channel:
      the class split must be detected (guards against a trivially-passing
      statistic).
  FTC.C3:
    name: frame independence control (must pass)
    procedure: >
      Post-compose each channel's y with a frozen nontrivial Moebius map:
      all transported Schwarzians and classes must be unchanged (cocycle
      correctness).

