id: CCC.DISC.SEARCH.01
version: 1
date_frozen: "2026-08-24"
status: preregistered_no_data_pass

firewall: >
  Search for crossover-relic disc signatures in CMB temperature maps
  under the TFPT cyclic [C] reading (origin_theory). This is a SEARCH
  TARGET, not a claim: a null result does not damage the TFPT compiler
  core (the cyclic reading is [C], not [E]); a hit would be a
  candidate, not a confirmation, until replicated. The observable is a
  residual boundary/crossover-relic pattern -- NOT direct Hawking
  radiation, NOT new gravity. No CMB data were touched before this
  freeze (2026-08-24).

provenance:
  thread: CCC.SEAM.CROSSOVER (experiments/tfpt-discovery, rounds DL-DLV)
  probes:
    - ccc_kernel_gamma_kms_probe.py      # freeze v1 (shape)
    - ccc_transfer_selector_probe.py     # freeze v2 (geometry)
    - ccc_kappa_freeze_probe.py          # freeze v3 (kappa derived)
  freeze_hashes_sha16:
    v1: 1df51166d0a2ef5b
    v2: a795401accbebdb4
    v3: 4cafe0457e0e89a1

template:
  class: causal top-hat disc (derived-kappa reading R1, freeze v3)
  radius_formula: theta_max = eta_rec / (eta_0 - eta_rec)
  radius_scan_band_deg: [1.0, 1.3]   # cosmography band around 1.16 deg
  edge: sharp (causal boundary convolved with beam ONLY)
  radial_contrast_bound: 3.3e-4      # derived kappa band => flat disc
  secondary_reading_R2: >
    If the derived-kappa chain is killed (K6), the fallback template is
    the freeze-v2 rim-brightened ring with edge-rate ratio
    ln3/ln(3/2) = 2.709511 and amplitude table below.
  amplitude_table:
    pair_class: {c2: "+-0.707107 (sheet-parity sign)", c3: "+0.408248"}
    anchor_class: {c2: "0", c3: "-0.816497"}

discriminators:
  - sharp causal edge (vs Gaussian spot templates)
  - sign-pairing statistics: pair-class relics occur as opposite-sign
    equal-amplitude pairs; anchor-class relics carry no pair component
  - radius confined to the frozen band (no free radius)

kill_conditions:
  K1: data demanding a single-Gaussian profile where the frozen
      template class is resolvable
  K2: a resolved two-component profile with amplitude ratio
      incompatible with sqrt(3):1 or 0:-2
  K3: a lambda_3 component with negative sign for a sheet-paired defect
  K4: a resolved crossover relic that is centrally peaked
  K5: a resolved ring with edge-rate ratio incompatible with 2.7095
  K6: a resolved relic with radial contrast > 1e-2 (kills the
      derived-kappa chain; reopens reading R2)

null_battery:
  - Gaussian LCDM simulations with matched mask, beam and noise
  - rotation shuffles of the candidate catalogue
  - half-mission split replication
  - injection-recovery of synthetic top-hat discs (detector validation
    BEFORE the real-data pass)

decision_rule: >
  SUPPORT requires Benjamini-Hochberg q < 0.01 against the null battery
  AND replication across half-missions AND at least two component
  separation methods (SMICA + Commander/NILC). Anything less: verdict
  from the enum {null, consistent, data_limited, tension,
  not_confirmed_not_refuted}; hint-level signals stay data_limited.

data_plan:
  source: Planck PR3 component-separated maps (public, PLA/IRSA)
  primary: COM_CMB_IQU-smica_2048_R3.00_full
  replication: [commander, nilc, half-mission splits]
  mask: common temperature confidence mask
